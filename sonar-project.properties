# =====================================================================
# SonarQube Static Code Analysis Configuration
# Janitha Sandanuwan - Enterprise Full-Stack Portfolio
# =====================================================================

# Unique project identification in SonarQube server
sonar.projectKey=janitha-portfolio
sonar.projectName=Janitha Sandanuwan - Full-Stack Portfolio
sonar.projectVersion=1.0.0

# Source directories to analyze
sonar.sources=frontend/src,backend/src/main/java
sonar.tests=backend/src/test/java

# Encoding
sonar.sourceEncoding=UTF-8

# Java compiled binaries location for deep bytecode analysis
sonar.java.binaries=backend/target/classes

# Exclusions (third-party dependencies, generated bundles, static assets)
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/target/**,\
  **/public/**,\
  **/*.spec.ts,\
  **/*.test.tsx,\
  **/*.d.ts

# Code Coverage (JaCoCo for Java, Jest/LCOV for Frontend)
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
