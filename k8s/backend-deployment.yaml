# =====================================================================
# Backend Workload: Spring Boot 3 Enterprise API
# Scalable Multi-Replica Deployment with Health Probes & ClusterIP Service
# =====================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-backend
  namespace: portfolio
  labels:
    app: portfolio-backend
    tier: api
spec:
  replicas: 2 # High Availability (HA) with 2 active instances
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # Zero-downtime rolling update guarantee
  selector:
    matchLabels:
      app: portfolio-backend
  template:
    metadata:
      labels:
        app: portfolio-backend
        tier: api
    spec:
      containers:
        - name: backend
          image: portfolio-backend:latest # Replaced by Jenkins with ECR image URL during CI/CD
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: portfolio-config
                  key: PORT_BACKEND
            - name: DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: portfolio-config
                  key: DATASOURCE_URL
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: portfolio-config
                  key: DB_USERNAME
            - name: SQL_INIT_MODE
              valueFrom:
                configMapKeyRef:
                  name: portfolio-config
                  key: SQL_INIT_MODE
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: portfolio-config
                  key: FRONTEND_URL
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: DB_PASSWORD
          # Health & Self-Healing Probes
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "1000m"

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: portfolio
  labels:
    app: portfolio-backend
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: portfolio-backend
