# =====================================================================
# Kubernetes Ingress Controller (HTTP/HTTPS Routing)
# Directs public web traffic between Frontend (Next.js) & Backend (Spring Boot)
# =====================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-ingress
  namespace: portfolio
  annotations:
    kubernetes.io/ingress.class: "nginx" # or alb for AWS Load Balancer Controller
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - http:
        paths:
          # 1. Route API requests to Spring Boot Backend Service
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080

          # 2. Route Swagger UI documentation to Backend Service
          - path: /swagger-ui
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080

          # 3. Route OpenAPI spec to Backend Service
          - path: /v3/api-docs
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080

          # 4. Route default web traffic to Next.js Frontend Service
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
