# =====================================================================
# Janitha Sandanuwan - Portfolio Enterprise Backend Configuration
# =====================================================================

# Server Port
server.port=${PORT:8080}
server.servlet.context-path=/

# Application Name
spring.application.name=janitha-portfolio-backend

# =====================================================================
# Microsoft SQL Server Datasource Configuration
# =====================================================================
spring.datasource.url=${DATASOURCE_URL:jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:portfolio_db};encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:Password@123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# =====================================================================
# Spring Data JPA / Hibernate Configuration
# =====================================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

# SQL Script Initialization (Runs schema and data scripts)
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.sql.init.continue-on-error=true

# =====================================================================
# Custom Portfolio Application Settings
# =====================================================================
portfolio.cors.allowed-origins[0]=http://localhost:3000
portfolio.cors.allowed-origins[1]=http://localhost:3001
portfolio.cors.allowed-origins[2]=https://janitha-portfolio.vercel.app

portfolio.contact.recipient-email=janithasandanuwa@gmail.com
portfolio.contact.email-notifications-enabled=false

# =====================================================================
# Swagger / OpenAPI 3 Interactive Documentation
# =====================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# =====================================================================
# Spring Actuator & Health Monitoring
# =====================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
